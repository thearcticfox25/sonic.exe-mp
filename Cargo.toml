[package]
name = "AdvancedServer"
version = "1.1.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0"

[[bin]]
name = "AdvancedServer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.25"
signal-hook = "0.4"
rand = "0.10"
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
crossterm = "0.29"
rusty_enet = { path = "./lib/rusty_enet/" }
png = "0.18"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
macroquad = "0.4.16"
# Without the realtime thread features, which need the D-Bus development files to build.
kira = { version = "0.12.5", default-features = false, features = ["cpal", "ogg", "vorbis"] }
# The same symphonia kira decodes with, for the music's own streaming decoder (client/ogg_stream.rs).
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis"] }
# Only to turn on kira's PipeWire output: through ALSA the mixer lists the game as
# "ALSA plug-in [AdvancedServer]" and the taskbar has no speaker on its window.
cpal = { version = "0.18", features = ["pipewire"] }
# Release builds keep Resources in one Resources.tar (see build.rs and core/resources).
# Without default features: those only restore extended file attributes on unpacking.
tar = { version = "0.4", default-features = false }
# The main menu's updater (client/updater.rs): HTTPS to GitHub, nothing more.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# SHA-256 of the updater's downloads; rustls brings it in already.
ring = "0.17"
# Gamepads (client/gamepad.rs). On Linux it reads them through libudev, whose headers
# the build needs (systemd-devel, libudev-dev).
gilrs = "0.11"


# PNG inflate and audio decoding are painfully slow without optimizations,
# so dependencies are optimized even in debug builds. The project's own code
# itself stays debuggable.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Line tables are enough for backtraces; full debug info made target/ grow to gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.release]
# opt-level 3: this is a 60Hz physics/anticheat server where throughput matters
# more than binary size. (Was "z" - optimized for size, leaving speed on the table.)
opt-level = 3
lto = true
strip = true

[build-dependencies]
# Packs Resources into Resources.tar for release builds.
tar = { version = "0.4", default-features = false }
# Puts the icon into the Windows program (build.rs embed_windows_icon), with windres or
# rc.exe, whichever the Windows build uses.
embed-resource = "3.0"
